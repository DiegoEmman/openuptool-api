version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openuptool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-openuptool}
      POSTGRES_USER: ${DB_USER:-openuptool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - openuptool-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-openuptool_user} -d ${DB_NAME:-openuptool}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openuptool-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@openuptool.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - openuptool-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  openuptool-network:
    driver: bridge
